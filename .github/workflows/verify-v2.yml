name: verify-v2

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/chengyouzheng/kidtv-guard/releases/tags/v2.0 --jq "{tag: .tag_name, name: .name, draft: .draft, prerelease: .prerelease, asset_count: (.assets|length), assets: [.assets[] | {name, size, state, download_count}]}" | tee release-assets.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-assets.txt
          git commit -m "chore: 记录 v2.0 资产校验结果" || echo nothing
          git push
