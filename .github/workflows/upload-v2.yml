name: upload-v2

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download apk
        run: |
          curl -fL --retry 2 -o kidtv-guard-v2.0.apk "https://aka.doubaocdn.com/s/NueANbeheL"
          ls -l kidtv-guard-v2.0.apk

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: "v2.0 — 答题页视觉改版"
          draft: false
          prerelease: false
          overwrite_files: true
          files: kidtv-guard-v2.0.apk

      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/chengyouzheng/kidtv-guard/releases/tags/v2.0 --jq "{tag: .tag_name, asset_count: (.assets|length), assets: [.assets[] | {name, size, state}]}" > release-assets.txt
          cat release-assets.txt

      - name: Commit result
        if: always()
        run: |
          rm -f kidtv-guard-v2.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-assets.txt
          git commit -m "chore: v2.0 资产上传结果" || echo nothing
          git push
