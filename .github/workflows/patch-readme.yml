name: patch-readme

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point install steps to v2.0 apk
        run: |
          sed -i 's/kidt v-guard-v1\.9\.apk/kidt v-guard-v2.0.apk/g' README.md
          grep -n "kidtv-guard-v2\.0\.apk" README.md || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 安装步骤指向 v2.0 安装包" || echo nothing
          git push
