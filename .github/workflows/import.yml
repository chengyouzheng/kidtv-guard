name: import-repo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bundle and apk
        run: |
          set -e
          curl -fsSL -o /tmp/src.tar.gz "https://aka.doubaocdn.com/s/yXYzrCrp7y"
          curl -fsSL -o /tmp/kidtv-guard-v1.9.apk "https://aka.doubaocdn.com/s/GwwlmqLchZ"
          ls -l /tmp/src.tar.gz /tmp/kidtv-guard-v1.9.apk
          file /tmp/kidtv-guard-v1.9.apk

      - name: Extract and copy
        run: |
          set -e
          rm -rf /tmp/src && mkdir -p /tmp/src
          tar -xzf /tmp/src.tar.gz -C /tmp/src
          ls -la /tmp/src
          cp -a /tmp/src/kidt*/. .
          rm -rf /tmp/src
          git status --porcelain | head -80

      - name: Commit changes
        run: |
          set -e
          git config user.name "kidtv-guard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feat: 导入 v1.9 源码、题库、语音与截图"
            git push
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9
          name: v1.9 — 老安卓电视盒子做题换时长
          draft: false
          prerelease: false
          body: |
            ## 学习看电视 v1.9

            **只给 Android 4.4 / 5.x 老机用。** Android 7 以上的新电视、新盒子请去用 StudyOnTV 等成熟项目（界面和功能都比本项目完整）。老盒子跑那些项目会出现 WebView 白屏、按钮点不动，所以才有这个用纯原生 View 重写的版本。

            ### 本版要点
            - 修复「正确答案全在 A」：逐题打乱选项并重算答案下标，各册 A/B/C/D 均约 25%
            - 拦截页删掉「回桌面」，只剩「去做题换时长」与「我是家长」，字号 34sp / 按钮高 92dp
            - 题库 12 册：小学 1–6 年级上/下册，每册 100 题（数学苏教版 50 + 语文常识 50）
            - 语音素材打包在 App 内，不依赖系统 TTS

            ### 装完必做的事
            1. 改家长密码（默认示例 123456）
            2. **改白名单**：把你的电视桌面包名填进面板白名单，不同品牌、不同运营商盒子都不一样，不改会被当成在看电视一直计时
            3. 在系统自启动管理里允许本应用自启

            详细说明见仓库 `README.md` 与 `docs/使用说明.md`。
          files: /tmp/kidtv-guard-v1.9.apk
