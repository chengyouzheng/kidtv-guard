name: fix-readme-v21

on: push

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace apk name
        run: |
          sed -i 's/kidtv-guard-v2\.0\.apk/kidtv-guard-v2.1.apk/g' README.md
          grep -n 'kidtv-guard-v2' README.md

      - name: Commit
        run: |
          git config user.name chengyouzheng
          git config user.email 743239848@qq.com
          git add README.md
          git commit -m "docs: README 安装链接指向 v2.1" || echo "nothing to commit"
          git push
